services:
  sqlc:
    image: sqlc/sqlc
    container_name: gophkeeper-sqlc
    volumes:
      - .:/src
    working_dir: /src
    command:
      - "generate"
  postgres:
    image: postgres:17
    container_name: gophkeeper-pg
    env_file:
      - ./.env
    ports:
      - "5436:5432"
    environment:
      DATABASE_URL: ${DATABASE_DSN}

    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
networks:
  default:
    driver: bridge